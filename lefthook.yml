pre-commit:
  commands:
    validate-placeholders:
      run: node scripts/validate-placeholders.js

    format:
      glob: '{,**/}*.{ts,tsx,js,jsx,mjs,cjs,json,md,css,yml,yaml}'
      exclude: '(node_modules|\.next|\.git|pnpm-lock\.yaml)'
      run: pnpm exec prettier --ignore-unknown --write {staged_files}
      stage_fixed: true

    lint-frontend:
      root: 'frontend/'
      glob: 'src/**/*.{ts,tsx}'
      run: npx eslint --fix {staged_files}

    lint-backend:
      root: 'backend/'
      glob: 'src/**/*.ts'
      run: npx eslint --fix {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: node scripts/check-commit-msg.js {1}
